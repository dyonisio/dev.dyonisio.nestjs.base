# Deploy MANUAL da API (AWS Lambda) e do front (S3 + CloudFront): Actions → "Deploy" →
# "Run workflow" → escolha o stage. Nada é publicado automaticamente.
#
# Configuração única (veja docs/DEPLOY_AWS_LAMBDA.md, seção "Deploy pelo GitHub Actions"):
#   1. Na AWS, crie um Identity Provider OIDC para token.actions.githubusercontent.com
#      e uma IAM Role que confie nele (sem chaves de acesso guardadas no GitHub).
#   2. No GitHub, em Settings → Environments, crie os environments "dev" e "prod"
#      (em "prod" você pode exigir aprovação de alguém antes de rodar).
#   3. Em cada environment, crie as variáveis: AWS_ROLE_ARN (ARN da role), FRONTEND_URL,
#      MAIL_FROM, SUPPORT_EMAIL e, opcionalmente, ALARM_EMAIL, GOOGLE_CLIENT_IDS, APPLE_CLIENT_IDS,
#      FALLBACK_LANGUAGE (idioma de quem ainda não escolheu um: en ou pt-BR; padrão en),
#      APP_NAME (nome do produto na API e no front; padrão "NestJS Base").
#   4. Domínios próprios (opcional, docs/DEPLOY_WEB.md): API_DOMAIN + API_CERTIFICATE_ARN e
#      WEB_DOMAIN + WEB_CERTIFICATE_ARN. Login social no front: WEB_GOOGLE_CLIENT_ID,
#      WEB_APPLE_CLIENT_ID, WEB_APPLE_REDIRECT_URI.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Ambiente de destino
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write # necessário para o login na AWS via OIDC

jobs:
  deploy:
    name: Deploy (${{ inputs.stage }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ inputs.stage }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - run: npm ci

      - name: Testes (não publica código quebrado)
        run: |
          npm test -- --ci
          npm run test:e2e -- --ci

      # Mostra o que o GitHub apresenta à AWS (não imprime o token, só as informações de identidade).
      # Se o login falhar com "Not authorized to perform sts:AssumeRoleWithWebIdentity", compare:
      #  - "sub" com a condição da trust policy da role (docs/aws/github-trust-policy.json)
      #  - "role" com o ARN da role no console (mesma conta e mesmo nome)
      - name: Diagnóstico do login na AWS
        uses: actions/github-script@v7
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub:         ${claims.sub}`);
            core.info(`aud:         ${claims.aud}`);
            core.info(`environment: ${claims.environment ?? '(nenhum)'}`);
            core.info(`role:        ${JSON.stringify(process.env.ROLE_ARN)}`);
            core.info(`region:      ${process.env.REGION}`);
            if (!process.env.ROLE_ARN) core.warning('AWS_ROLE_ARN vazio: crie a variável no environment');
            else if (process.env.ROLE_ARN !== process.env.ROLE_ARN.trim()) core.warning('AWS_ROLE_ARN tem espaços ou quebra de linha');

      - name: Login na AWS (OIDC, sem chaves fixas)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build + deploy
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED }}
          FALLBACK_LANGUAGE: ${{ vars.FALLBACK_LANGUAGE }}
          APP_NAME: ${{ vars.APP_NAME }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
          APPLE_CLIENT_IDS: ${{ vars.APPLE_CLIENT_IDS }}
          STAGE: ${{ inputs.stage }}
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        # Valores via variáveis de ambiente (não interpolados no script): sem injeção de comandos.
        # O Serverless recusa "--param=chave=" vazio, então só os preenchidos são enviados.
        run: |
          missing=""
          for name in FRONTEND_URL MAIL_FROM SUPPORT_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Variáveis obrigatórias vazias no environment '$STAGE':$missing (Settings → Environments → $STAGE)"
            exit 1
          fi

          params=(
            --param="frontendUrl=$FRONTEND_URL"
            --param="mailFrom=$MAIL_FROM"
            --param="supportEmail=$SUPPORT_EMAIL"
          )
          [ -n "$ALARM_EMAIL" ] && params+=(--param="alarmEmail=$ALARM_EMAIL")
          [ -n "$CORS_ORIGIN" ] && params+=(--param="corsOrigin=$CORS_ORIGIN")
          [ -n "$SWAGGER_ENABLED" ] && params+=(--param="swaggerEnabled=$SWAGGER_ENABLED")
          [ -n "$FALLBACK_LANGUAGE" ] && params+=(--param="fallbackLanguage=$FALLBACK_LANGUAGE")
          [ -n "$APP_NAME" ] && params+=(--param="appName=$APP_NAME")
          [ -n "$GOOGLE_CLIENT_IDS" ] && params+=(--param="googleClientIds=$GOOGLE_CLIENT_IDS")
          [ -n "$APPLE_CLIENT_IDS" ] && params+=(--param="appleClientIds=$APPLE_CLIENT_IDS")
          if [ -n "$API_DOMAIN" ] && [ -n "$API_CERTIFICATE_ARN" ]; then
            params+=(--param="apiDomain=$API_DOMAIN" --param="apiCertificateArn=$API_CERTIFICATE_ARN")
            params+=(--param="appUrl=https://$API_DOMAIN")
          fi

          npm run build
          service=$(awk '/^service:/ {print $2}' serverless.yml)
          migrate_fn="$service-$STAGE-migrate"
          # --region explícito: a mesma região da credencial, dos segredos (SSM) e do SES
          deploy() { npx serverless deploy --stage "$STAGE" --region "$REGION" "${params[@]}"; }

          # Migrations pela Lambda "migrate" (ela alcança o banco; o runner do GitHub não).
          # Uma migration que falha para o deploy e a API continua na versão anterior.
          migrate() {
            echo "::group::Migrations"
            aws lambda invoke --function-name "$migrate_fn" --cli-read-timeout 330 \
              /tmp/migrate.json > /tmp/invoke.json
            cat /tmp/invoke.json /tmp/migrate.json; echo
            echo "::endgroup::"
            if grep -q FunctionError /tmp/invoke.json; then
              echo "::error::As migrations falharam (veja o grupo Migrations acima e os logs da função $migrate_fn). A API não foi atualizada."
              exit 1
            fi
          }

          if aws lambda get-function --function-name "$migrate_fn" > /dev/null 2>&1; then
            # Normal: atualiza só a função migrate com o código novo, aplica as migrations,
            # e só então troca o código da API (que já encontra o banco pronto)
            npx serverless deploy function -f migrate --stage "$STAGE" --region "$REGION" "${params[@]}"
            migrate
            deploy
          else
            # Primeira vez (a função ainda não existe): deploy completo e migrations logo depois
            deploy
            migrate
          fi

      # ---------------------------------------------------------------- front (apps/web)

      # Endereços que o front precisa: a API (domínio próprio ou o do API Gateway) e o bucket
      # de uploads (entra na CSP). Lidos das saídas do stack que o deploy acabou de atualizar.
      - name: Saídas da API
        id: api
        env:
          STAGE: ${{ inputs.stage }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN }}
        run: |
          service=$(awk '/^service:/ {print $2}' serverless.yml)
          out() {
            aws cloudformation describe-stacks --stack-name "$service-$STAGE" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          if [ -n "$API_DOMAIN" ] && [ -n "$API_CERTIFICATE_ARN" ]; then
            api_origin="https://$API_DOMAIN"
          else
            api_origin=$(out HttpApiUrl)
          fi
          {
            echo "service=$service"
            echo "api_origin=${api_origin%/}"
            echo "uploads_origin=$(out UploadsOrigin)"
            echo "api_target=$(out ApiDomainTarget)"
          } >> "$GITHUB_OUTPUT"

      - name: Infra do front (S3 + CloudFront)
        id: web
        env:
          STAGE: ${{ inputs.stage }}
          SERVICE: ${{ steps.api.outputs.service }}
          API_ORIGIN: ${{ steps.api.outputs.api_origin }}
          UPLOADS_ORIGIN: ${{ steps.api.outputs.uploads_origin }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_CERTIFICATE_ARN: ${{ vars.WEB_CERTIFICATE_ARN }}
        run: |
          stack="$SERVICE-$STAGE-web"
          aws cloudformation deploy \
            --template-file ../web/infra/web.yml \
            --stack-name "$stack" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
            "Service=$SERVICE" "Stage=$STAGE" \
            "DomainName=$WEB_DOMAIN" "CertificateArn=$WEB_CERTIFICATE_ARN" \
            "ApiOrigin=$API_ORIGIN" "UploadsOrigin=$UPLOADS_ORIGIN"
          out() {
            aws cloudformation describe-stacks --stack-name "$stack" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "bucket=$(out BucketName)"
            echo "distribution=$(out DistributionId)"
            echo "domain=$(out DistributionDomain)"
            echo "url=$(out SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Build do front
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ steps.api.outputs.api_origin }}
          VITE_APP_NAME: ${{ vars.APP_NAME }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.WEB_GOOGLE_CLIENT_ID }}
          VITE_APPLE_CLIENT_ID: ${{ vars.WEB_APPLE_CLIENT_ID }}
          VITE_APPLE_REDIRECT_URI: ${{ vars.WEB_APPLE_REDIRECT_URI }}
        run: |
          npm ci
          npm run build

      # assets/ (nome com hash, nunca muda): cache de 1 ano. Arquivos sem hash (favicon, icon.png
      # do 2FA): 1 hora. O index.html é revalidado sempre, para a versão nova chegar na hora.
      - name: Publicar o front
        working-directory: apps/web
        env:
          BUCKET: ${{ steps.web.outputs.bucket }}
          DISTRIBUTION: ${{ steps.web.outputs.distribution }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --exclude index.html \
            --cache-control "public,max-age=3600"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths /index.html > /dev/null

      - name: Resumo (endereços e DNS)
        env:
          SITE_URL: ${{ steps.web.outputs.url }}
          WEB_TARGET: ${{ steps.web.outputs.domain }}
          API_ORIGIN: ${{ steps.api.outputs.api_origin }}
          API_TARGET: ${{ steps.api.outputs.api_target }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          {
            echo "### Publicado"
            echo ""
            echo "| | Endereço |"
            echo "|---|---|"
            echo "| Site | $SITE_URL |"
            echo "| API | $API_ORIGIN |"
            if [ -n "$WEB_DOMAIN$API_DOMAIN" ]; then
              echo ""
              echo "### Registros DNS (uma vez só; no Cloudflare: proxy **desligado**, DNS only)"
              echo ""
              echo "| Tipo | Nome | Destino |"
              echo "|---|---|---|"
              [ -n "$WEB_DOMAIN" ] && echo "| CNAME | \`$WEB_DOMAIN\` | \`$WEB_TARGET\` |"
              [ -n "$API_DOMAIN" ] && [ "$API_TARGET" != "None" ] && echo "| CNAME | \`$API_DOMAIN\` | \`$API_TARGET\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
